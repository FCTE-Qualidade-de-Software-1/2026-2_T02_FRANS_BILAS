name: Metrics
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'documentation/snippets/management/**'
      - 'documentation/site/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update metrics snippets and tables
        run: python3 .github/scripts/update_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/snippets/management/*
          if git diff --staged --quiet; then
            echo "No metric snippet changes to commit."
          else
            git commit -m "feat(metrics): update management snippets and tables [skip ci]"
            git push
          fi
